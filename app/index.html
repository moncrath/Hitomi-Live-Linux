<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hitomi Live — dev</title>
    <style>
      @font-face {
        /* Itim (SIL OFL 1.1, lihat assets/ui/OFL-Itim.txt). size-adjust 83% menyamakan
           lebar teks dengan font lama (Vividly), jadi tata letak menu & bubble tak bergeser. */
        font-family: 'Itim';
        src: url('/ui/Itim-Regular.ttf') format('truetype');
        size-adjust: 83%;
        font-display: swap;
      }
      :root { color-scheme: dark; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 100%; height: 100%; overflow: hidden; }
      /* Kanvas avatar transparan. Bg dev = checker halus biar keliatan alpha-nya.
         Di Tauri nanti body ini yang transparan sungguhan. */
      body {
        background:
          linear-gradient(45deg, #1c1720 25%, transparent 25%) -8px 0,
          linear-gradient(-45deg, #1c1720 25%, transparent 25%) -8px 0,
          linear-gradient(45deg, transparent 75%, #1c1720 75%),
          linear-gradient(-45deg, transparent 75%, #1c1720 75%);
        background-size: 16px 16px;
        background-color: #241d2a;
        font-family: system-ui, sans-serif;
      }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; }
      /* Ring fokus keyboard untuk tombol lingkaran tembus klik: ring bawaan cuma 1px
         abu-abu. Pink sama dengan tepi panel dan lingkaran. */
      #hitomi-clickthrough:focus-visible { outline: 2px solid #fab3df; outline-offset: 2px; border-radius: 50%; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
